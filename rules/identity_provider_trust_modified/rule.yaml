kind: signal
id: identity_provider_trust_modified
title: IAM の SAML や OIDC の ID プロバイダの作成や変更
severity: high
tactics: [TA0004, TA0112]
attrs: [action]
sql: |
  SELECT
    event_time           AS start_time,
    event_time           AS end_time,
    [event_id]           AS event_ids,
    access_key_id,
    principal_key,
    source_ip,
    recipient_account_id AS account_id,
    aws_region           AS region,
    event_name           AS attr_action
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND event_source = 'iam.amazonaws.com'
    AND event_name IN (
      'CreateSAMLProvider',
      'UpdateSAMLProvider',
      'CreateOpenIDConnectProvider',
      'UpdateOpenIDConnectProviderThumbprint',
      'AddClientIDToOpenIDConnectProvider'
    )
    AND error_code IS NULL
