kind: signal
id: organization_left
title: AWS Organizations からのアカウントの離脱
severity: high
tactics: [TA0112]
sql: |
  SELECT
    event_time           AS start_time,
    event_time           AS end_time,
    [event_id]           AS event_ids,
    access_key_id,
    principal_key,
    source_ip,
    recipient_account_id AS account_id,
    aws_region           AS region
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND event_source = 'organizations.amazonaws.com'
    AND event_name = 'LeaveOrganization'
    AND error_code IS NULL
