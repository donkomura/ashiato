kind: signal
id: cloudshell_activity
title: CloudShell からの操作
severity: low
tactics: [TA0002]
sql: |
  SELECT
    event_time           AS start_time,
    event_time           AS end_time,
    [event_id]           AS event_ids,
    access_key_id,
    principal_key,
    source_ip,
    recipient_account_id AS account_id,
    aws_region           AS region
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND (
      event_source = 'cloudshell.amazonaws.com'
      OR strpos(user_agent, 'exec-env/CloudShell') > 0
    )
