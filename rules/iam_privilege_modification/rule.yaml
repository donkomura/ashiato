kind: signal
id: iam_privilege_modification
title: IAM の権限の変更
severity: high
tactics: [TA0004]
sql: |
  SELECT
    event_time           AS start_time,
    event_time           AS end_time,
    [event_id]           AS event_ids,
    access_key_id,
    principal_key,
    source_ip,
    recipient_account_id AS account_id,
    aws_region           AS region
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND event_source = 'iam.amazonaws.com'
    AND event_name IN (
      'PutRolePolicy',
      'AttachRolePolicy',
      'PutUserPolicy',
      'AttachUserPolicy',
      'CreatePolicyVersion',
      'UpdateAssumeRolePolicy'
    )
    AND error_code IS NULL
