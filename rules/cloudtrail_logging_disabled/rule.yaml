kind: signal
id: cloudtrail_logging_disabled
title: CloudTrail の証跡の停止や削除
severity: high
tactics: [TA0005]
attrs: [trail]
sql: |
  SELECT
    event_time           AS start_time,
    event_time           AS end_time,
    [event_id]           AS event_ids,
    access_key_id,
    principal_key,
    source_ip,
    recipient_account_id AS account_id,
    aws_region           AS region,
    {{ json(request_parameters, '$.name') }} AS attr_trail
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND event_source = 'cloudtrail.amazonaws.com'
    AND event_name IN ('StopLogging', 'DeleteTrail')
    AND error_code IS NULL
