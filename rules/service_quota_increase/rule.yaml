kind: signal
id: service_quota_increase
title: サービスクォータの引き上げの申請
severity: low
tactics: [TA0112]
attrs: [service_code, quota_code]
sql: |
  SELECT
    event_time           AS start_time,
    event_time           AS end_time,
    [event_id]           AS event_ids,
    access_key_id,
    principal_key,
    source_ip,
    recipient_account_id AS account_id,
    aws_region           AS region,
    {{ json(request_parameters, '$.serviceCode') }} AS attr_service_code,
    {{ json(request_parameters, '$.quotaCode') }}   AS attr_quota_code
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND event_source = 'servicequotas.amazonaws.com'
    AND event_name = 'RequestServiceQuotaIncrease'
    AND error_code IS NULL
