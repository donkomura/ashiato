kind: signal
id: role_session_outlier
title: 同じロールのほかのセッションが使わない API を呼ぶセッション
severity: medium
tactics: [TA0006, TA0007]
params:
  min_sessions: 5
  min_unique_apis: 3
attrs: [unique_apis, sessions]
sql: |
  WITH sessions AS (
    SELECT principal_key, access_key_id, event_source, event_name
    FROM events
    WHERE ({{ in_baseline_window(event_time) }} OR {{ in_analysis_window(event_time) }})
      AND identity_type = 'AssumedRole'
      AND access_key_id IS NOT NULL
      AND invoked_by IS NULL
    GROUP BY principal_key, access_key_id, event_source, event_name
  ),
  fleets AS (
    SELECT principal_key, count(DISTINCT access_key_id) AS session_count
    FROM sessions
    GROUP BY principal_key
    HAVING count(DISTINCT access_key_id) >= {{ param('min_sessions') }}
  ),
  unique_apis AS (
    SELECT principal_key, event_source, event_name
    FROM sessions
    GROUP BY principal_key, event_source, event_name
    HAVING count(DISTINCT access_key_id) = 1
  )
  SELECT
    min(e.event_time)        AS start_time,
    max(e.event_time)        AS end_time,
    array_agg(e.event_id)    AS event_ids,
    e.access_key_id,
    e.principal_key,
    min(e.source_ip)         AS source_ip,
    e.recipient_account_id   AS account_id,
    min(e.aws_region)        AS region,
    cast(count(DISTINCT e.event_name) AS VARCHAR) AS attr_unique_apis,
    cast(min(f.session_count) AS VARCHAR) AS attr_sessions
  FROM events e
  JOIN fleets f ON f.principal_key = e.principal_key
  JOIN unique_apis u
    ON u.principal_key = e.principal_key
   AND u.event_source = e.event_source
   AND u.event_name = e.event_name
  WHERE {{ in_analysis_window(e.event_time) }}
    AND e.identity_type = 'AssumedRole'
    AND e.invoked_by IS NULL
  GROUP BY e.access_key_id, e.principal_key, e.recipient_account_id
  HAVING count(DISTINCT e.event_name) >= {{ param('min_unique_apis') }}
