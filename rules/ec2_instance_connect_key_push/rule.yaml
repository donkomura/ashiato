kind: signal
id: ec2_instance_connect_key_push
title: 主体がベースライン期間に使っていない、EC2 Instance Connect による SSH 公開鍵の送り込み
severity: medium
tactics: [TA0003, TA0008]
attrs: [instance_id]
sql: |
  SELECT
    e.event_time           AS start_time,
    e.event_time           AS end_time,
    [e.event_id]           AS event_ids,
    e.access_key_id,
    e.principal_key,
    e.source_ip,
    e.recipient_account_id AS account_id,
    e.aws_region           AS region,
    {{ json(e.request_parameters, '$.instanceId') }} AS attr_instance_id
  FROM events e
  WHERE {{ in_analysis_window(e.event_time) }}
    AND e.error_code IS NULL
    AND e.event_source = 'ec2-instance-connect.amazonaws.com'
    AND e.event_name = 'SendSSHPublicKey'
    AND e.principal_key IN (SELECT principal_key FROM baseline_principals)
    AND NOT EXISTS (
      SELECT 1 FROM baseline b
      WHERE b.principal_key = e.principal_key
        AND b.dim = 'event_name'
        AND b.value = e.event_name
    )
