kind: signal
id: cloud_service_hijack_probe
title: Bedrock のモデルの利用や SES の送信を可能にする設定の変更
severity: medium
tactics: [TA0040]
sql: |
  SELECT
    event_time           AS start_time,
    event_time           AS end_time,
    [event_id]           AS event_ids,
    access_key_id,
    principal_key,
    source_ip,
    recipient_account_id AS account_id,
    aws_region           AS region
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND error_code IS NULL
    AND (
      (
        event_source = 'bedrock.amazonaws.com'
        AND event_name IN (
          'PutUseCaseForModelAccess',
          'PutFoundationModelEntitlement',
          'CreateFoundationModelAgreement'
        )
      )
      OR (
        event_source = 'ses.amazonaws.com'
        AND event_name IN ('UpdateAccountSendingEnabled', 'PutAccountDetails')
        AND coalesce({{ json(request_parameters, '$.enabled') }}, 'true') <> 'false'
      )
    )
