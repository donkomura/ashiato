kind: signal
id: traffic_mirroring_created
title: VPC のトラフィックミラーリングの作成や変更
severity: medium
tactics: [TA0006, TA0010]
attrs: [action]
sql: |
  SELECT
    event_time           AS start_time,
    event_time           AS end_time,
    [event_id]           AS event_ids,
    access_key_id,
    principal_key,
    source_ip,
    recipient_account_id AS account_id,
    aws_region           AS region,
    event_name           AS attr_action
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND error_code IS NULL
    AND event_source = 'ec2.amazonaws.com'
    AND event_name IN (
      'CreateTrafficMirrorSession',
      'CreateTrafficMirrorTarget',
      'ModifyTrafficMirrorSession'
    )
