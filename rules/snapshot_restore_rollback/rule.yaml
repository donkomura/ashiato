kind: signal
id: snapshot_restore_rollback
title: 主体がベースライン期間に使っていない、スナップショットによるインスタンスやデータベースの復元
severity: low
tactics: [TA0112]
attrs: [action]
sql: |
  SELECT
    e.event_time           AS start_time,
    e.event_time           AS end_time,
    [e.event_id]           AS event_ids,
    e.access_key_id,
    e.principal_key,
    e.source_ip,
    e.recipient_account_id AS account_id,
    e.aws_region           AS region,
    e.event_name           AS attr_action
  FROM events e
  WHERE {{ in_analysis_window(e.event_time) }}
    AND e.error_code IS NULL
    AND (
      (e.event_source = 'ec2.amazonaws.com' AND e.event_name = 'CreateReplaceRootVolumeTask')
      OR (
        e.event_source = 'rds.amazonaws.com'
        AND e.event_name IN ('RestoreDBInstanceFromDBSnapshot', 'RestoreDBClusterFromSnapshot')
      )
    )
    AND e.principal_key IN (SELECT principal_key FROM baseline_principals)
    AND NOT EXISTS (
      SELECT 1 FROM baseline b
      WHERE b.principal_key = e.principal_key
        AND b.dim = 'event_name'
        AND b.value = e.event_name
    )
