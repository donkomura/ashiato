kind: signal
id: iam_persistence
title: IAM ユーザーや認証情報の作成による永続化
severity: high
tactics: [TA0003]
sql: |
  SELECT
    event_time           AS start_time,
    event_time           AS end_time,
    [event_id]           AS event_ids,
    access_key_id,
    principal_key,
    source_ip,
    recipient_account_id AS account_id,
    aws_region           AS region
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND event_source = 'iam.amazonaws.com'
    AND event_name IN (
      'CreateUser',
      'CreateAccessKey',
      'CreateLoginProfile',
      'UpdateLoginProfile'
    )
    AND error_code IS NULL
