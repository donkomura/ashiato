kind: signal
id: password_policy_change
title: アカウントのパスワードポリシーの変更や削除の試行
severity: low
tactics: [TA0005]
attrs: [result]
sql: |
  SELECT
    event_time           AS start_time,
    event_time           AS end_time,
    [event_id]           AS event_ids,
    access_key_id,
    principal_key,
    source_ip,
    recipient_account_id AS account_id,
    aws_region           AS region,
    coalesce(error_code, 'Success') AS attr_result
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND event_source = 'iam.amazonaws.com'
    AND event_name IN ('UpdateAccountPasswordPolicy', 'DeleteAccountPasswordPolicy')
