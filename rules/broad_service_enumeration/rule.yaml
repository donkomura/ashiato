kind: signal
id: broad_service_enumeration
title: 短時間に多数のサービスにわたる参照系 API の呼び出し
severity: medium
tactics: [TA0007]
params:
  min_services: 10
  bin: 10m
attrs: [services, calls]
sql: |
  SELECT
    min(event_time)          AS start_time,
    max(event_time)          AS end_time,
    array_agg(event_id)      AS event_ids,
    access_key_id,
    principal_key,
    source_ip,
    recipient_account_id     AS account_id,
    min(aws_region)          AS region,
    cast(count(DISTINCT event_source) AS VARCHAR) AS attr_services,
    cast(count(*) AS VARCHAR) AS attr_calls
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND (
      event_name LIKE 'List%'
      OR event_name LIKE 'Describe%'
      OR event_name LIKE 'Get%'
    )
    AND coalesce(credential_from_console, FALSE) = FALSE
  GROUP BY access_key_id, principal_key, source_ip, recipient_account_id,
           {{ time_bin(event_time, param('bin')) }}
  HAVING count(DISTINCT event_source) >= {{ param('min_services') }}
