kind: signal
id: federation_token_issued
title: IAM ユーザーによるフェデレーションの認証情報の発行
severity: medium
tactics: [TA0003, TA0008]
attrs: [federated_name]
sql: |
  SELECT
    event_time           AS start_time,
    event_time           AS end_time,
    [event_id]           AS event_ids,
    access_key_id,
    principal_key,
    source_ip,
    recipient_account_id AS account_id,
    aws_region           AS region,
    {{ json(request_parameters, '$.name') }} AS attr_federated_name
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND error_code IS NULL
    AND event_source = 'sts.amazonaws.com'
    AND event_name = 'GetFederationToken'
    AND identity_type = 'IAMUser'
