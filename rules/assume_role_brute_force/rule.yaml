kind: signal
id: assume_role_brute_force
title: 1 つの認証情報からの、拒否された AssumeRole の集中
severity: medium
tactics: [TA0004, TA0008]
params:
  min_denied: 20
  bin: 10m
attrs: [attempts]
sql: |
  SELECT
    min(event_time)          AS start_time,
    max(event_time)          AS end_time,
    array_agg(event_id)      AS event_ids,
    access_key_id,
    principal_key,
    min(source_ip)           AS source_ip,
    recipient_account_id     AS account_id,
    min(aws_region)          AS region,
    cast(count(*) AS VARCHAR) AS attr_attempts
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND event_source = 'sts.amazonaws.com'
    AND event_name = 'AssumeRole'
    AND error_code IN ('AccessDenied', 'AccessDeniedException')
  GROUP BY access_key_id, principal_key, recipient_account_id,
           {{ time_bin(event_time, param('bin')) }}
  HAVING count(*) >= {{ param('min_denied') }}
