kind: signal
id: bucket_name_enumeration
title: 存在しないバケットや拒否されるバケットへの、多数のバケット名にわたる問い合わせ
severity: medium
tactics: [TA0007]
params:
  min_buckets: 20
  bin: 1h
attrs: [caller_ip, buckets]
sql: |
  SELECT
    min(event_time)          AS start_time,
    max(event_time)          AS end_time,
    array_agg(event_id)      AS event_ids,
    access_key_id,
    principal_key,
    source_ip,
    recipient_account_id     AS account_id,
    min(aws_region)          AS region,
    source_ip                AS attr_caller_ip,
    cast(count(DISTINCT {{ json(request_parameters, '$.bucketName') }}) AS VARCHAR)
                             AS attr_buckets
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND event_source = 's3.amazonaws.com'
    AND error_code IN ('NoSuchBucket', 'AccessDenied', 'AllAccessDisabled')
  GROUP BY access_key_id, principal_key, source_ip, recipient_account_id,
           {{ time_bin(event_time, param('bin')) }}
  HAVING count(DISTINCT {{ json(request_parameters, '$.bucketName') }})
         >= {{ param('min_buckets') }}
