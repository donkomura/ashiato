kind: signal
id: s3_block_public_access_disabled
title: S3 のパブリックアクセスブロックの無効化
severity: low
tactics: [TA0005]
attrs: [bucket]
sql: |
  SELECT
    event_time           AS start_time,
    event_time           AS end_time,
    [event_id]           AS event_ids,
    access_key_id,
    principal_key,
    source_ip,
    recipient_account_id AS account_id,
    aws_region           AS region,
    {{ json(request_parameters, '$.bucketName') }} AS attr_bucket
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND event_source = 's3.amazonaws.com'
    AND error_code IS NULL
    AND (
      event_name IN ('DeleteBucketPublicAccessBlock', 'DeleteAccountPublicAccessBlock')
      OR (
        event_name IN ('PutBucketPublicAccessBlock', 'PutAccountPublicAccessBlock')
        AND 'false' IN (
          {{ json(request_parameters, '$.PublicAccessBlockConfiguration.BlockPublicAcls') }},
          {{ json(request_parameters, '$.PublicAccessBlockConfiguration.IgnorePublicAcls') }},
          {{ json(request_parameters, '$.PublicAccessBlockConfiguration.BlockPublicPolicy') }},
          {{ json(request_parameters, '$.PublicAccessBlockConfiguration.RestrictPublicBuckets') }}
        )
      )
    )
