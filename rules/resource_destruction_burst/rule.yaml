kind: signal
id: resource_destruction_burst
title: 1 つのセッションで集中した、インスタンス、ボリューム、スナップショット、データベース、バケットの削除
severity: high
tactics: [TA0040]
params:
  min_deletions: 5
  bin: 10m
sql: |
  SELECT
    min(event_time)          AS start_time,
    max(event_time)          AS end_time,
    array_agg(event_id)      AS event_ids,
    access_key_id,
    principal_key,
    min(source_ip)           AS source_ip,
    recipient_account_id     AS account_id,
    min(aws_region)          AS region
  FROM events
  WHERE {{ in_analysis_window(event_time) }}
    AND error_code IS NULL
    AND (
      (
        event_source = 'ec2.amazonaws.com'
        AND event_name IN ('TerminateInstances', 'DeleteVolume', 'DeleteSnapshot')
      )
      OR (
        event_source = 'rds.amazonaws.com'
        AND event_name IN ('DeleteDBInstance', 'DeleteDBCluster')
      )
      OR (event_source = 's3.amazonaws.com' AND event_name = 'DeleteBucket')
    )
  GROUP BY access_key_id, principal_key, recipient_account_id,
           {{ time_bin(event_time, param('bin')) }}
  HAVING count(*) >= {{ param('min_deletions') }}
