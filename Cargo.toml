[workspace]
resolver = "3"
members = [
    "crates/ashiato-core",
    "crates/ashiato-testkit",
    "crates/ashiato-pipeline",
    "crates/ashiato-ingest",
    "crates/ashiato-duckdb",
    "crates/ashiato-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
