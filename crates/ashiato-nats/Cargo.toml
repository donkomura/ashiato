[package]
name = "ashiato-nats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
arrow-array = "60.0.0"
arrow-ipc = "60.0.0"
arrow-schema = "60.0.0"
ashiato-pipeline = { version = "0.1.0", path = "../ashiato-pipeline" }
async-nats = { version = "=0.51.0", default-features = false, features = ["jetstream", "ring", "server_2_10"] }
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = "0.4.45"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time"] }

[dev-dependencies]
ashiato-core = { version = "0.1.0", path = "../ashiato-core" }
ashiato-duckdb = { version = "0.1.0", path = "../ashiato-duckdb" }
ashiato-ingest = { version = "0.1.0", path = "../ashiato-ingest" }
ashiato-testkit = { version = "0.1.0", path = "../ashiato-testkit" }
arrow-select = "60.0.0"
async-trait = "0.1.92"
chrono = "0.4.45"
duckdb = "1.20000.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
