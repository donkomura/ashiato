[package]
name = "ashiato-duckdb"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
bundled = ["duckdb/bundled", "duckdb/json"]

[dependencies]
ashiato-core = { version = "0.1.0", path = "../ashiato-core" }
async-trait = "0.1.92"
chrono = "0.4.45"
duckdb = "1.20000.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }

[dev-dependencies]
flate2 = "1.1.10"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
