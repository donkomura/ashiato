[package]
name = "ashiato-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ashiato"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
ashiato-core = { version = "0.1.0", path = "../ashiato-core" }
ashiato-duckdb = { version = "0.1.0", path = "../ashiato-duckdb" }
async-trait = "0.1.92"
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.155.0"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt"] }

[dev-dependencies]
duckdb = "1.20000.0"
flate2 = "1.1.10"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
