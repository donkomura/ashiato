[package]
name = "ashiato-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ashiato"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
ashiato-core = { version = "0.1.0", path = "../ashiato-core" }
ashiato-testkit = { version = "0.1.0", path = "../ashiato-testkit" }
ashiato-duckdb = { version = "0.1.0", path = "../ashiato-duckdb" }
ashiato-ingest = { version = "0.1.0", path = "../ashiato-ingest" }
ashiato-nats = { version = "0.1.0", path = "../ashiato-nats" }
ashiato-pipeline = { version = "0.1.0", path = "../ashiato-pipeline" }
async-nats = { version = "=0.51.0", default-features = false, features = ["jetstream", "ring", "server_2_10"] }
async-trait = "0.1.92"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "time"] }

[dev-dependencies]
duckdb = "1.20000.0"
flate2 = "1.1.10"
serde_json = { version = "1.0.154", features = ["raw_value"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
