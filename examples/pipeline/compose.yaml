name: ashiato-example

services:
  nats:
    image: nats:2.10.29
    command: ["--config", "/etc/nats/nats.conf"]
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "127.0.0.1:4222:4222"

  minio:
    image: bitnamilegacy/minio:2025.7.23
    entrypoint: ["minio"]
    command: ["server", "/data"]
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ashiato-example
      MINIO_ROOT_PASSWORD: ashiato-example-secret
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 1s
      timeout: 5s
      retries: 60

  upload:
    image: bitnamilegacy/minio:2025.7.23
    profiles: [upload]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://ashiato-example:ashiato-example-secret@minio:9000
    volumes:
      - ./logs:/logs:ro
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mc mb --ignore-existing local/ashiato-example &&
        mc version enable local/ashiato-example &&
        mc cp --quiet --recursive /logs/AWSLogs/ local/ashiato-example/AWSLogs/
