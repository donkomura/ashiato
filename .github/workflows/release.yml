name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask dist --target "$TARGET" --output target/dist
      - name: Check that the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: test -f "target/dist/ashiato-${GITHUB_REF_NAME#v}-$TARGET.tar.gz"
      - name: Run the release on a system without Rust or DuckDB
        run: |
          docker run --rm -v "$PWD:/repo:ro" ubuntu:26.04 \
            sh -c '/repo/.github/scripts/smoke-release.sh /repo/target/dist/ashiato-*.tar.gz'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: sha256sum *.tar.gz > SHA256SUMS
        working-directory: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
